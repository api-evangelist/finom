aid: finom
name: Finom
description: >-
  Finom is a European fintech headquartered in Amsterdam that provides business
  banking, invoicing, and financial management for entrepreneurs, freelancers,
  and SMEs. Operating as a licensed Electronic Money Institution (EMI) supervised
  by De Nederlandsche Bank (DNB), Finom offers multi-currency business accounts,
  24/7 SEPA Instant and SWIFT payments, direct debits, Visa Business physical and
  virtual cards with up to 3% cashback, compliant e-invoicing (ZUGFeRD, XRechnung),
  and integrations with accounting platforms such as DATEV, Lexware, sevDesk, Xero,
  and QuickBooks. It serves Germany, France, Italy, Spain, and the Netherlands with
  region-specific tooling. Finom does not currently publish a public developer API
  program; this profile captures its public discovery, security, and operational
  surface (llms.txt, security.txt / Intigriti VDP, domain security, status page).
